name: Firestore rules

# firestore.rules is the security perimeter of every household app. It deploys
# only from here, only from pwa, and only after the emulator suite passes.

on:
  push:
    branches:
      - pwa
    paths:
      - firestore.rules
      - firebase.json
      - tests/rules/**
      - .github/workflows/firestore-rules.yml
  pull_request:
    branches:
      - pwa
    paths:
      - firestore.rules
      - firebase.json
      - tests/rules/**
      - .github/workflows/firestore-rules.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firestore-rules-${{ github.ref }}
  cancel-in-progress: false

env:
  FIREBASE_TOOLS_VERSION: "13.29.1"
  FIREBASE_PROJECT: our-house-815ea

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The Firestore emulator needs Java; without it the gate stops gating.
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@${{ env.FIREBASE_TOOLS_VERSION }}

      - name: Run rules emulator suite
        run: npm run test:rules

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/pwa'
    runs-on: ubuntu-latest
    environment:
      name: firestore-rules

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@${{ env.FIREBASE_TOOLS_VERSION }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_RULES_DEPLOYER_KEY }}

      - name: Deploy Firestore rules
        run: firebase deploy --only firestore:rules --project "$FIREBASE_PROJECT" --non-interactive
